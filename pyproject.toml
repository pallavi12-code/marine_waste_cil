[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marine-waste-cil"
version = "0.1.0"
description = "Class-incremental learning utilities for marine waste classification"
requires-python = ">=3.10"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.2",
    "Pillow==10.4.0",
    "opencv-python-headless==4.10.0.84",
    "matplotlib==3.8.4",
    "seaborn==0.13.2",
    "scikit-learn==1.5.1",
    "torch==2.3.1",
    "torchvision==0.18.1",
    "tqdm==4.70.1",
    "PyYAML==6.0.3",
]

[tool.setuptools.packages.find]
include = ["marine_waste_cil*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
